<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطة التوجيه الصحي 1448</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@700;800;900&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --bg:#F1F5F5; --paper:#FFFFFF; --paper2:#F7FAFA; --ink:#12303A; --muted:#5A6F77; --line:#D6E1E3;
  --teal:#1B7F93; --teal-ink:#0E5A69; --teal-soft:#E2F1F4; --gold:#B5842C; --gold-soft:#F6EBD5;
  --moe:#CDE9F3; --hh:#E3E6E8; --both:#F6D5C2;
  --ok:#2E8656; --ok-soft:#E1F2E8; --warn:#B87909; --warn-soft:#FBF0D9; --bad:#BD3A2E; --bad-soft:#FBE4E1; --plan:#6D8088; --plan-soft:#EAF0F1;
  --shadow:0 1px 2px rgba(18,48,58,.06),0 6px 20px rgba(18,48,58,.06);
  --kufi:"Noto Kufi Arabic","Tajawal",system-ui,sans-serif; --body:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  --hdr:#0E5A69; --hero:#0E5A69; --slide:#0B2A31; --slide-sub:#9FD3DE;
  --r-acc:#1B7F93; --r-ink:#0E5A69; --r-soft:#E2F1F4; --r-line:#9DB7BD;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E181B; --paper:#152328; --paper2:#1A2B31; --ink:#E2ECEE; --muted:#94A9AF; --line:#2A3C42;
    --teal:#52B6CA; --teal-ink:#8FD3E0; --teal-soft:#16353D; --gold:#D9AB55; --gold-soft:#3A3020;
    --moe:#1C4150; --hh:#2B3439; --both:#4B3327;
    --ok:#5CC08A; --ok-soft:#173327; --warn:#E3AC45; --warn-soft:#3A2F17; --bad:#EE7B6F; --bad-soft:#3D1F1C; --plan:#9AB0B7; --plan-soft:#223238;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --hdr:#0B2A31; --hero:#113A43; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181B; --paper:#152328; --paper2:#1A2B31; --ink:#E2ECEE; --muted:#94A9AF; --line:#2A3C42;
  --teal:#52B6CA; --teal-ink:#8FD3E0; --teal-soft:#16353D; --gold:#D9AB55; --gold-soft:#3A3020;
  --moe:#1C4150; --hh:#2B3439; --both:#4B3327;
  --ok:#5CC08A; --ok-soft:#173327; --warn:#E3AC45; --warn-soft:#3A2F17; --bad:#EE7B6F; --bad-soft:#3D1F1C; --plan:#9AB0B7; --plan-soft:#223238;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --hdr:#0B2A31; --hero:#113A43; color-scheme:dark;
}
/* ===== ثيم مدارس البنات (موف خفيف) ===== */
:root[data-school="g"]{
  --bg:#F6F3FA; --paper:#FFFFFF; --paper2:#FAF8FD; --ink:#2A2138; --muted:#6E6282; --line:#E3DAEE;
  --teal:#8A63B8; --teal-ink:#6B479A; --teal-soft:#EFE7F8; --gold:#B5842C; --gold-soft:#F8EEDC;
  --plan-soft:#EEEAF3;
  --hdr:linear-gradient(135deg,#A283CB 0%,#8060B0 100%); --hero:linear-gradient(135deg,#9474C2 0%,#71519F 100%);
  --slide:#2C1F40; --slide-sub:#D6C4F0;
  --r-acc:#8A63B8; --r-ink:#6B479A; --r-soft:#EFE7F8; --r-line:#CDBDE3;
}
@media (prefers-color-scheme:dark){:root[data-school="g"]:not([data-theme="light"]){
  --bg:#16121C; --paper:#201A28; --paper2:#261F30; --ink:#EDE7F4; --muted:#ADA2BD; --line:#3A3048;
  --teal:#B99BE6; --teal-ink:#D5C3F2; --teal-soft:#2E2440; --gold-soft:#332B20; --plan-soft:#2A2433;
  --hdr:#33254A; --hero:#3E2D5A;
}}
:root[data-school="g"][data-theme="dark"]{
  --bg:#16121C; --paper:#201A28; --paper2:#261F30; --ink:#EDE7F4; --muted:#ADA2BD; --line:#3A3048;
  --teal:#B99BE6; --teal-ink:#D5C3F2; --teal-soft:#2E2440; --gold-soft:#332B20; --plan-soft:#2A2433;
  --hdr:#33254A; --hero:#3E2D5A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{background:var(--hdr);color:#fff;padding-inline:16px;padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 320px;min-width:0}
.brand h1{font-family:"Noto Kufi Arabic","Tajawal",system-ui,sans-serif;font-weight:900;font-size:clamp(20px,2.6vw,27px);margin:0;line-height:1.45;letter-spacing:0;text-wrap:balance;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.brand .yr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px}
.brand .yr b{font-family:"Noto Kufi Arabic","Tajawal",sans-serif;font-weight:800;font-size:14px;color:#10262C;background:linear-gradient(180deg,#F1CF86,#D9AB55);padding:3px 14px;border-radius:6px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.brand small{opacity:.85;font-size:13px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#062026}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#062026}}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.top .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.top .btn.gold{background:var(--gold);border-color:var(--gold)}
.tabs{max-width:1180px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:rgba(255,255,255,.75);padding:10px 16px;font-weight:700;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:#fff;border-color:var(--gold)}
.demo{background:var(--gold-soft);color:var(--ink);text-align:center;font-size:13px;padding:6px 16px}

main{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:22px 60px}
.view[hidden]{display:none}
h2.sec{font-family:var(--kufi);font-size:18px;margin:0 0 12px;font-weight:800;line-height:1.5}
.sub{color:var(--muted);font-size:13px}

/* overview */
.ov{display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media (max-width:820px){.ov{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.next{background:var(--hero);color:#fff;border:0;position:relative;overflow:hidden}
.next .eyebrow{color:#F3D99E;font-size:13px;font-weight:700;letter-spacing:.02em}
.next h3{font-family:var(--kufi);font-weight:900;font-size:26px;line-height:1.45;margin:6px 0 4px;text-wrap:balance}
.next .dates{opacity:.9}
.countdown{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.countdown b{font-size:52px;line-height:1;font-weight:800;color:#F3D99E}
.next .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.next .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:28px;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:6px;background:var(--plan-soft);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--ok)}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--paper);text-align:start;width:100%}
.li:hover{border-color:var(--teal)}
.datebox{flex:none;width:54px;text-align:center;border-radius:9px;background:var(--teal-soft);color:var(--teal-ink);padding:4px 0;line-height:1.2}
.datebox b{display:block;font-size:20px}
.datebox span{font-size:11px}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:700}
.li .t span{color:var(--muted);font-size:13px}
.ov2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:820px){.ov2{grid-template-columns:1fr}}

/* chips & pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-done{background:var(--ok-soft);color:var(--ok)}
.s-prog{background:var(--warn-soft);color:var(--warn)}
.s-plan{background:var(--plan-soft);color:var(--plan)}
.s-late{background:var(--bad-soft);color:var(--bad)}
.s-na{background:var(--plan-soft);color:var(--muted)}
.ex{display:inline-block;font-size:12px;border-radius:6px;padding:1px 8px;color:var(--ink)}
.ex-moe{background:var(--moe)} .ex-hh{background:var(--hh)} .ex-both{background:var(--both)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 7px;color:var(--muted)}

/* timeline */
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}
.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
@media (max-width:820px){.lanes{grid-template-columns:1fr}}
.lane h4{margin:0 0 8px;font-family:var(--kufi);font-weight:800;font-size:14px}
.lane .chipbtn{display:block;width:100%;text-align:start;border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-bottom:6px;font-size:13.5px}
.chipbtn.ex-moe,.chipbtn.ex-hh,.chipbtn.ex-both{border-color:transparent}
.months{position:relative;border-inline-start:3px solid var(--line);margin-inline-start:8px;padding-inline-start:0}
.month{position:relative;padding-inline-start:22px;padding-bottom:18px}
.month::before{content:"";position:absolute;inset-inline-start:-9px;top:4px;width:15px;height:15px;border-radius:50%;background:var(--paper);border:3px solid var(--teal)}
.month.past::before{border-color:var(--line)}
.month.now::before{background:var(--gold);border-color:var(--gold)}
.mhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:8px}
.mhead b{font-family:var(--kufi);font-size:17px;font-weight:800}
.mhead span{color:var(--muted);font-size:13px}
.termmark{display:inline-block;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:12px;border-radius:6px;padding:1px 8px;margin-inline-start:auto}
.today-mark{font-size:12px;font-weight:800;color:var(--gold)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}

/* programs grid */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.switch{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:start}
.card:hover{border-color:var(--teal);box-shadow:var(--shadow)}
.card .cat{font-size:12px;color:var(--teal);font-weight:700}
.card h3{margin:0;font-family:var(--kufi);font-weight:800;font-size:16px;line-height:1.55;text-wrap:balance}
.card .when{font-size:13px;color:var(--muted)}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;flex-wrap:wrap}
.card.dim{opacity:.55}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,24,29,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:50}
.sheet{background:var(--paper);border-radius:16px;width:100%;max-width:860px;box-shadow:var(--shadow);overflow:hidden}
.sheet-h{background:var(--teal-soft);padding:18px 20px;display:flex;gap:12px;align-items:flex-start}
.sheet-h .x{margin-inline-start:auto;background:var(--paper);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;flex:none;font-size:18px}
.sheet-h h3{margin:2px 0 6px;font-family:var(--kufi);font-size:22px;line-height:1.5;font-weight:900}
.sheet-b{padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.fact dt{font-size:12px;color:var(--muted);font-weight:700}
.fact dd{margin:0}
.block h4{margin:0 0 6px;font-family:var(--kufi);font-weight:800;font-size:15px;color:var(--teal-ink)}
.block p{margin:0;max-width:70ch}
.block ul{margin:0;padding-inline-start:20px}
.track{background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:14px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:6px 12px;font-weight:700;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700;color:var(--muted)}
.form input,.form textarea,.form select{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 9px;font-weight:400;color:var(--ink)}
.form .wide{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:500;color:var(--ink)}
.checks label{flex-direction:row;align-items:center;gap:5px;color:var(--ink);font-weight:500}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos figure{margin:0;position:relative}
.photos img{width:96px;height:72px;object-fit:contain;background:var(--paper2);border-radius:8px;border:1px solid var(--line)}
.photos button{position:absolute;top:2px;inset-inline-start:2px;background:var(--paper);border:1px solid var(--line);border-radius:6px;font-size:11px;padding:0 5px}
.sheet-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* report preview */
.rp-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.rp-wrap{background:var(--bg);padding:16px;overflow-x:auto}
.paper{background:#fff;color:#1a1a1a;width:210mm;height:297mm;max-width:none;margin:0 auto;padding:11mm 12mm 9mm;box-shadow:0 2px 12px rgba(0,0,0,.15);font-size:11pt;overflow:hidden;box-sizing:border-box}
.pin{display:flex;flex-direction:column;min-height:100%}
/* report layout (shared by preview and print) */
.r-head{display:grid;grid-template-columns:1.35fr auto 1fr;align-items:center;border-bottom:3px double var(--r-acc);padding-bottom:6px;gap:10px}
.r-head .r1{font-size:10.5pt;line-height:1.65;font-weight:700;text-align:center;justify-self:start}
.r-head .r3{font-size:10.5pt;line-height:1.8;text-align:center;justify-self:end}
.r-head .logo{width:32mm;height:auto;display:block}
.r-title{text-align:center;margin:8px 0 6px}
.r-title h2{font-family:var(--kufi);font-weight:900;font-size:15pt;margin:0;color:var(--r-ink)}
.r-title div{font-size:10pt;color:#555}
.r-tbl{width:100%;border-collapse:collapse;margin:6px 0;font-size:10.5pt}
.r-tbl th,.r-tbl td{border:1px solid var(--r-line);padding:4px 7px;vertical-align:middle;text-align:center}
.r-tbl th{background:var(--r-soft);color:var(--r-ink);width:18%;font-weight:700}
.r-tbl.plan th{width:auto}
.r-tbl.plan td{font-size:9.5pt}
.r-sec{background:var(--r-acc);color:#fff;font-family:var(--kufi);font-weight:800;padding:2px 10px;margin-top:7px;font-size:10.5pt;border-radius:3px}
.r-box{border:1px solid var(--r-line);border-top:0;padding:5px 9px;min-height:16mm;font-size:10.5pt;white-space:pre-wrap;line-height:1.7}
.r-line{border-bottom:1px dotted #777;display:inline-block;min-width:40mm}
.r-checks{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:10.5pt;padding:5px 8px;border:1px solid var(--r-line);border-top:0}
.r-photos{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:6px;margin-top:6px}
.r-photos div{border:1px solid var(--r-line);height:var(--ph,30mm);display:flex;align-items:center;justify-content:center;color:#999;font-size:9pt;overflow:hidden;background:#fff;padding:2px}
.r-photos div.empty{border-style:dashed}
.r-photos img{max-width:100%;max-height:calc(var(--ph,30mm) - 6px);width:auto;height:auto;object-fit:contain;display:block}
.r-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:auto;padding-top:14px;text-align:center;font-size:11pt;line-height:1.9}
.r-sign>div:first-child{justify-self:start;min-width:60mm}.r-sign>div:last-child{justify-self:end;min-width:60mm}
.r-sign b{display:block}
.r-foot{margin-top:8px;font-size:8.5pt;color:#777;text-align:center;border-top:1px solid #ddd;padding-top:3px}
.ex-dot{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-inline-end:4px}

/* presentation */
.show{position:fixed;inset:0;z-index:80;background:var(--slide);color:#fff;display:flex;flex-direction:column}
.show-top{display:flex;align-items:center;gap:10px;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top,0px));font-size:13px;opacity:.85}
.show-top .sp{flex:1}
.show-top button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;padding:5px 12px}
.slide{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px clamp(18px,7vw,110px);gap:18px;animation:fade .35s ease}
@keyframes fade{from{opacity:.2;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide{animation:none}}
.slide .eb{color:#F3D99E;font-weight:700;letter-spacing:.02em}
.slide h2{font-family:var(--kufi);font-size:clamp(28px,5vw,56px);line-height:1.4;margin:0;font-weight:900;text-wrap:balance}
.slide .d{font-size:clamp(17px,2.1vw,24px);max-width:62ch;line-height:1.8;opacity:.95}
.slide .meta{display:flex;flex-wrap:wrap;gap:10px}
.slide .meta div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:8px 14px}
.slide .meta small{display:block;color:var(--slide-sub);font-size:12px}
.slide .role{border-inline-start:4px solid #D9AB55;padding-inline-start:14px;max-width:70ch}
.show-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.show-nav button{background:#D9AB55;border:0;color:#10262c;font-weight:800;border-radius:10px;padding:10px 20px;font-size:16px}
.show-nav button:disabled{opacity:.35}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;max-width:60%}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}
.dots i.on{background:#D9AB55}

/* settings */
.set{max-width:720px}
.set .form{grid-template-columns:1fr 1fr}
@media (max-width:560px){.set .form{grid-template-columns:1fr}}

  steps:["حجز موعد الطالب عن طريق تطبيق صحتي في عيادة طب الأسرة.","يراجع الطالب مركز الرعاية الصحية الأولية برفقة ولي أمره.","استكمال تطعيمات السن المدرسي وتوثيقها إلكترونياً.","يتم فحص الطالب وفق مكونات الفحص.","تسجيل بيانات الطالب ونتائج الفحوصات في النظام الإلكتروني (منصة صحة).","يتم تحديد نتيجة الفحص الصحي للطالب (لائق، لائق ويحال للتربية الخاصة).","يتم تحويل الطالب إلى الجهة المختصة إن لزم الأمر."],

 {id:"back",name:"حملة العودة إلى المدارس 1448هـ",cat:"camp",ex:"both",exList:["وزارة التعليم","الصحة القابضة (التجمعات الصحية)"],sup:["هيئة الصحة العامة"],

 {id:"air",name:"اليوم الدولي لنقاوة الهواء",cat:"day",ex:"moe",sup:["هيئة الصحة العامة"],stages:ST4,tg:ALL4,term:"t1",fixed:["2026-09-07"],period:"7 سبتمبر 2026م",

 {id:"breast",name:"شهر التوعية بسرطان الثدي",cat:"day",ex:"moe",sup:["هيئة الصحة العامة"],stages:["mid","sec"],tg:["sf","tf"],term:"t1",fixed:["2026-10-01","2026-10-31"],period:"شهر أكتوبر 2026م",

 {id:"diab",name:"اليوم العالمي للسكري",cat:"day",ex:"moe",sup:["هيئة الصحة العامة"],stages:ST3,tg:ALL4,term:"t1",fixed:["2026-11-14"],period:"14 نوفمبر 2026م",

 {id:"airp",name:"نحافظ على الهواء نحافظ على الحياة",cat:"aw",ex:"moe",sup:["هيئة الصحة العامة"],stages:ST4,tg:ALL4,term:"t1",suggest:"2026-10-18",period:"الفصل الدراسي الأول",

 {id:"sal1",name:"أصدقاء سلامة",cat:"aw",ex:"moe",sup:["هيئة الصحة العامة","المركز السعودي لسلامة المرضى"],stages:["pri"],tg:["sm","sf"],term:"t1",suggest:"2026-11-01",period:"الفصل الدراسي الأول",

 {id:"allergy",name:"التوعية بالحساسية",cat:"visit",ex:"hh",sup:["هيئة الصحة العامة"],stages:ST3,tg:ALL4,term:"t1",period:"الفصل الدراسي الأول",
  desc:"برنامج توعوي يهدف إلى التعريف بالحساسية بمختلف أنواعها، وتعزيز الوعي بكيفية الوقاية منها والتعامل الصحيح معها عند ظهور أعراضها. كما يتناول البرنامج أكثر أنواع الحساسية شيوعاً، بما يسهم في رفع مستوى الوعي الصحي لدى الطلبة، وتمكينهم من اتخاذ الإجراءات المناسبة للحفاظ على سلامتهم وصحتهم، والتصرف السليم في الحالات الطارئة."},
 {id:"cond",name:"التعامل مع الحالات الصحية",cat:"visit",ex:"hh",sup:["هيئة الصحة العامة"],stages:["mid","sec"],tg:["sm","sf"],term:"t1",period:"الفصل الدراسي الأول",

 {id:"mental",name:"الصحة النفسية والعلاقات الاجتماعية",cat:"visit",ex:"hh",sup:["هيئة الصحة العامة"],stages:["mid","sec"],tg:["sm","sf"],term:"t1",period:"الفصل الدراسي الأول",

 {id:"exp1",name:"الفحص الاستكشافي — الفصل الأول",cat:"exam",ex:"both",exList:["وزارة التعليم (الموجه الصحي)","الصحة القابضة (التجمعات الصحية)"],sup:["هيئة الصحة العامة","وزارة التعليم (الموجه الصحي)"],
  stages:ST3,stageNote:"الابتدائية (أول–رابع)، المتوسطة (الصف الأول)، الثانوية (الصف الأول)",tg:["sm","sf"],term:"t1",period:"الفصل الدراسي الأول",
  desc:"برنامج فحص طبي لطلبة المدارس تقوم به فرق الصحة المدرسية بالتجمعات الصحية، ويهدف إلى الكشف المبكر لمجموعة من المشاكل الصحية عن طريق إجراء عدد من الفحوص الطبية وإحالتها لجهة الاختصاص مع تقديم التوعية الصحية وبناء قاعدة بيانات صحية للطلبة.",
  stepsTitle:"الزيارات الميدانية للمدارس",steps:["تحديد يوم الكشف مسبقاً بالتنسيق مع الموجه الصحي في المدرسة.","يقوم الموجه الصحي بتسليم الاستمارات الخاصة بالفحص للفريق الطبي يوم موعد الزيارة.","يقوم الموجه الصحي بتحضير أماكن مناسبة لإجراء الفحص الطبي وتوفير الخصوصية للطلبة.","إجراء الكشف وفق الفحوص المستهدفة لكل صف وفق الدليل.","تسجيل نتائج الكشف إلكترونياً في النظام الإلكتروني.","تقديم الإرشاد والإحالة للطالب حسب المشكلة الصحية."],
  steps2Title:"زيارة مركز الرعاية الصحية الأولية",steps2:["يتم حجز موعد للطالب في المركز الصحي عن طريق تطبيق صحتي.","يراجع الطالب مركز الرعاية الصحية الأولية برفقة ولي الأمر.","يتم فحص الطالب وفق مكونات الفحص.","تسجيل بيانات الطالب ونتائج الفحوصات.","تقديم التوعية الصحية وإحالة الطالب حسب الحالة."]},
 {id:"env1",name:"تفقد البيئة المدرسية والمقصف — الفصل الأول",cat:"exam",ex:"both",exList:["وزارة التعليم (الموجه الصحي)","الصحة القابضة (التجمعات الصحية)"],sup:["هيئة الصحة العامة"],
  stages:ST3,tg:["sch"],term:"t1",period:"الفصل الدراسي الأول",
  desc:"برنامج مشترك بين قطاعي الصحة والتعليم بهدف الإشراف على البيئة المدرسية والمقصف المدرسي والتأكد من سلامة البيئة المدرسية، وصحة الغذاء المتداول في المقصف المدرسي، ومتابعة إزالة المخالفات في البيئة المدرسية والمقصف المدرسي.",
  stepsTitle:"يتم تنفيذ البرنامج من قبل فريق المركز الصحي",steps:["إعداد خطة المركز الصحي في تنفيذ البرامج لجميع المدارس الواقعة في نطاقه، ورفعها إلى إدارة الصحة المدرسية في المنطقة لاعتمادها.","تنفيذ الزيارات لتفقد البيئة المدرسية والمقصف وفق الخطة المعتمدة.","تسجيل نتائج الزيارات في الاستمارات المعتمدة ورفعها إلى مدير المدرسة وإرسال نسخة منها إلى إدارة الصحة المدرسية في المنطقة.","في حال وجود أي مخالفات في المقصف المدرسي يتم تعبئة نموذج إشعار بوجود مخالفة وتسليمه إلى مدير المدرسة للعمل على إزالة المخالفة.","يقوم الفريق الصحي بالزيارة للتأكد من إزالة مخالفات الزيارة السابقة.","يتم رفع تقارير دورية بالمخالفات إلى إدارات التعليم لمتابعتها والتأكد من إزالته."],
  role:["إدخال بيانات استمارة البيئة في نظام نور."]},
 {id:"nutri",name:"النظام الغذائي الصحي",cat:"aw",ex:"moe",sup:["هيئة الصحة العامة"],stages:ST4,tg:ALL4,term:"t2",suggest:"2027-02-07",period:"الفصل الدراسي الثاني",

const D=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const add=(s,n)=>{const d=D(s);d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const fG=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"long",year:"numeric"});
const fGm=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{month:"long",year:"numeric"});
const fGd=new Intl.DateTimeFormat("ar-SA-u-ca-gregory-nu-latn",{day:"numeric",month:"short"});

try{fH=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"});fHm=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{month:"long",year:"numeric"})}catch(e){fH=fHm={format:()=>""}}
const g=s=>fG.format(D(s)), h=s=>fH.format(D(s)).replace(/\s*هـ$/,"")+"هـ";
const days=(a,b)=>Math.round((D(b)-D(a))/864e5);

function dates(p){
  const s=st(p.id),T=S.set;
  if(s.planned) return {a:s.planned,b:s.planned,src:"planned"};
  if(p.fixed) return {a:p.fixed[0],b:p.fixed[1]||p.fixed[0],src:"fixed"};
  if(p.rel==="back"){const a=add(T.yStart,-7);return {a,b:add(a,13),src:"rel"}}
  if(p.rel==="intro") return {a:T.yStart,b:add(T.yStart,13),src:"rel"};
  if(p.suggest) return {a:p.suggest,b:p.suggest,src:"suggest"};
  return null;
}
function whenText(p,short){
  const d=dates(p);
  if(!d) return p.period;
  const one=d.a===d.b;
  let t=one?g(d.a):(fGd.format(D(d.a))+" – "+g(d.b));
  if(!short) t+=" · "+h(d.a);
  if(d.src==="suggest") t+=" (تاريخ مقترح)";
  if(d.src==="planned") t+=" (مجدول)";
  return t;
}
function status(p){
  const s=st(p.id).status||"plan";
  if(s==="plan"||s==="prog"){const d=dates(p); if(d&&d.b<TODAY&&s==="plan") return "late"}
  return s;
}
const STN={plan:"مخطط",prog:"قيد التنفيذ",done:"منفذ",late:"متأخر",na:"لا ينطبق"};
const pill=p=>{const s=status(p);return `<span class="pill s-${s}">${STN[s]}</span>`};
const exChip=p=>`<span class="ex ex-${p.ex}">${p.ex==="moe"?W("الموجه الصحي"):p.ex==="hh"?"التجمع الصحي":"مشترك"}</span>`;

function L(){const T=S.set,b=T.gender==="b";return {
  stu:T.stuG==="b"?"الطلاب":"الطالبات", stu1:T.stuG==="b"?"طالب":"طالبة",
  tch:T.tchG==="b"?"المعلمون":"المعلمات", tchA:T.tchG==="b"?"المعلمين":"المعلمات",
  cou:b?"الموجه الصحي":"الموجهة الصحية", prin:b?"مدير المدرسة":"مديرة المدرسة", type:b?"بنين":"بنات"}}
function mine(p){
  const T=S.set; if(!p.stages.includes(T.stage)) return false;
  const ok=["par","sch",T.stuG==="b"?"sm":"sf",T.tchG==="b"?"tm":"tf",T.gender==="b"?"cm":"cf"];
  return p.tg.some(t=>ok.includes(t));
}
function tgMine(p){const T=S.set,drop=new Set([T.stuG==="b"?"sf":"sm",T.tchG==="b"?"tf":"tm",T.gender==="b"?"cf":"cm"]);
  const r=p.tg.filter(k=>!drop.has(k));return (r.length?r:p.tg).map(k=>TGT[k]).join("، ")}
const W=s=>{const T=S.set;return T.gender==="b"?s:s.replace(/الموجه الصحي/g,"الموجهة الصحية").replace(/مدير المدرسة/g,"مديرة المدرسة")};
const cnt=k=>{const v=S.set[k];return v===""||v==null?null:+v};
/* العدد المستهدف لبرنامج حسب فئاته */
function targetCounts(p){const T=S.set,r={};

  if(p.tg.includes("par")) r.P=cnt("cntP");
  return r}
const pctOf=(n,t)=>n!=null&&n!==""&&t?Math.min(100,Math.round(n/t*100))+"%":"—";

function renderTimeline(){
  const T=S.set, my=document.getElementById("tlMine")?.checked ?? true;
  const list=P.filter(p=>!my||mine(p));
  const lanes={pre:[],t1:[],t2:[]};
  list.filter(p=>!dates(p)).forEach(p=>lanes[p.term].push(p));
  const laneHtml=(k,t)=>`<div class="panel lane"><h4>${t}</h4>${lanes[k].map(p=>`<button class="chipbtn ex-${p.ex}" data-open="${p.id}">${esc(p.name)} <span style="float:left">${pill(p)}</span></button>`).join("")||'<div class="empty">—</div>'}</div>`;
  let months=[]; let cur=new Date(D(T.yStart).getFullYear(),D(T.yStart).getMonth(),1); const end=D(T.yEnd);
  while(cur<=end){months.push(new Date(cur));cur.setMonth(cur.getMonth()+1)}
  const dated=sorted(list.filter(p=>dates(p)));
  const tm=new Date();const nowKey=tm.getFullYear()*12+tm.getMonth();
  const mHtml=months.map(m=>{
    const k=m.getFullYear()*12+m.getMonth(); const last=new Date(m.getFullYear(),m.getMonth()+1,0);
    const items=dated.filter(p=>{const d=D(dates(p).a);return d.getFullYear()*12+d.getMonth()===k});
    const hA=fHm.format(m).replace(/\s*هـ$/,""), hB=fHm.format(last).replace(/\s*هـ$/,"");
    const hl=hA.split(" ")[0]===hB.split(" ")[0]?hA:(hA.split(" ")[0]+" – "+hB);
    let marks=[];
    [[T.yStart,"بداية العام الدراسي"],[T.t1End,"نهاية الفصل الأول"],[T.t2Start,"بداية الفصل الثاني"],[T.yEnd,"نهاية العام"]].forEach(([d,t])=>{const x=D(d);if(x.getFullYear()*12+x.getMonth()===k)marks.push(`<span class="termmark">${t} · ${fGd.format(x)}</span>`)});
    return `<div class="month ${k<nowKey?"past":k===nowKey?"now":""}">
      <div class="mhead"><b>${fGm.format(m)}</b><span>${hl}هـ</span>${k===nowKey?'<span class="today-mark">● الشهر الحالي</span>':""}${marks.join("")}</div>
      <div class="list">${items.map(p=>{const d=dates(p),a=D(d.a);return `<button class="li" data-open="${p.id}"><div class="datebox"><b class="num">${a.getDate()}</b><span>${fGw.format(a)}</span></div><div class="t"><b>${esc(p.name)}</b><span>${whenText(p)}</span></div>${exChip(p)} ${pill(p)}</button>`}).join("")||'<div class="empty">لا توجد مناسبات مجدولة</div>'}</div>
    </div>`}).join("");
  document.getElementById("v-timeline").innerHTML=`
    <div class="filters" style="justify-content:space-between">
      <div class="legend"><span><i class="ex-dot ex-moe"></i>وزارة التعليم</span><span><i class="ex-dot ex-hh"></i>الصحة القابضة (التجمعات الصحية)</span><span><i class="ex-dot ex-both"></i>وزارة التعليم والصحة القابضة</span></div>
      <label class="switch"><input type="checkbox" id="tlMine" ${my?"checked":""}> برامج مدرستي فقط</label>
    </div>

function shrink(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,720/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.62))};im.src=fr.result};fr.readAsDataURL(file)})}

  const row=p=>{const d=dates(p),s=st(p.id);return `<tr><td>${++n}</td><td style="text-align:center"><i class="ex-dot" style="background:${p.ex==="moe"?"#CDE9F3":p.ex==="hh"?"#E3E6E8":"#F6D5C2"}"></i>${esc(p.name)}</td><td>${CATS[p.cat]}</td><td>${d?(d.a===d.b?hNum(d.a):hNum(d.a)+" – "+hNum(d.b))+"<br><small>"+(d.a===d.b?gNum(d.a):gNum(d.a)+" – "+gNum(d.b))+"</small>":esc(p.period)}</td><td>${p.ex==="moe"?W("الموجه الصحي"):p.ex==="hh"?"التجمع الصحي":"مشترك"}</td><td>${STN[status(p)]}</td><td>${s.execDate?hNum(s.execDate):""}</td></tr>`};
  const sect=(t,k)=>{const l=list.filter(p=>p.term===k);return l.length?`<tr><td colspan="7" style="background:var(--r-acc);color:#fff;font-weight:700">${t}</td></tr>`+l.map(row).join(""):""};
  return `<div class="paper"><div class="pin">${rHead("الخطة الزمنية للبرامج الصحية المدرسية 1448هـ",`${esc(T.school)} — ${STAGE[T.stage]} (${L().type}) — ${list.length} برنامجاً${cnt("cntS")?" — عدد "+L().stu+": "+cnt("cntS"):""}`,TODAY)}
   <table class="r-tbl plan"><thead><tr><th>م</th><th>البرنامج</th><th>المجال</th><th>الموعد</th><th>المنفذ</th><th>الحالة</th><th>تاريخ التنفيذ</th></tr></thead>
   <tbody>${sect("قبل بداية العام الدراسي","pre")}${sect("الفصل الدراسي الأول","t1")}${sect("الفصل الدراسي الثاني","t2")}</tbody></table>
   <div style="font-size:9pt;margin-top:4px;text-align:center"><i class="ex-dot" style="background:#CDE9F3"></i>وزارة التعليم &nbsp; <i class="ex-dot" style="background:#E3E6E8"></i>الصحة القابضة (التجمعات الصحية) &nbsp; <i class="ex-dot" style="background:#F6D5C2"></i>وزارة التعليم والصحة القابضة</div>
   <div class="r-sign"><div><b>${W("الموجه الصحي")}</b>${esc(T.counselor)}<br>التوقيع: ..................</div><div><b>${L().prin}</b>${T.principal?esc(T.principal):"...................................."}<br>التوقيع: ..................</div></div>`;
}
const RTYPE={pre:"نموذج ما قبل التنفيذ",post:"تقرير بعد التنفيذ"};
function markSaved(id,mode){const s=st(id);s.reports=s.reports||{};s.reports[mode]={savedAt:new Date().toISOString()};save()}
function openReport(kind,id,mode){
  const root=document.getElementById("modalRoot");
  const build=()=>kind==="plan"?planReport():progReport(id,mode);
  root.innerHTML=`<div class="modal" id="rm"><div class="sheet" style="max-width:900px">
   <div class="rp-bar">
    ${kind==="plan"?"<b>الخطة الزمنية — معاينة الطباعة</b>":`<div class="seg" id="rmode"><button data-k="pre" aria-pressed="${mode==="pre"}">نموذج ما قبل التنفيذ</button><button data-k="post" aria-pressed="${mode==="post"}">تقرير بعد التنفيذ</button></div>`}
    <span style="flex:1"></span>
    ${kind==="plan"?"":`<button class="btn" id="redit">✏️ تعديل البيانات</button><button class="btn" id="rsave">💾 حفظ التقرير</button>`}
    <button class="btn primary" id="rprint">🖨 طباعة / حفظ PDF</button><button class="btn" id="rclose">إغلاق</button>
   </div>
   <div class="rp-wrap" id="rbody"></div></div></div>`;
  const draw=()=>{rbody.innerHTML=build();arabize(rbody);rbody.querySelectorAll(".paper").forEach(fitPaper)};
  draw();
  rclose.onclick=()=>{root.innerHTML="";refreshLists()};
  rm.onclick=e=>{if(e.target.id==="rm")rclose.onclick()};
  if(window.rmode) rmode.onclick=e=>{const b=e.target.closest("button");if(!b)return;mode=b.dataset.k;rmode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));draw()};
  if(window.rsave) rsave.onclick=()=>{markSaved(id,mode);toast("تم حفظ "+RTYPE[mode]+" في «التقارير المحفوظة»")};
  if(window.redit) redit.onclick=()=>{root.innerHTML="";openProg(id)};
  rprint.onclick=()=>{if(kind!=="plan")markSaved(id,mode);const pr=document.getElementById("print-root");pr.innerHTML=rbody.innerHTML;window.print()};
}
function renderReports(){
  const rows=[];
  P.forEach(p=>{const s=st(p.id);const r=s.reports||{};["pre","post"].forEach(m=>{if(r[m])rows.push({p,m,at:r[m].savedAt})})});
  rows.sort((a,b)=>b.at.localeCompare(a.at));
  const fmt=t=>{const d=new Date(t);return hNum(iso(d))+" · "+d.toLocaleTimeString("ar-SA-u-nu-latn",{hour:"2-digit",minute:"2-digit"})};
  document.getElementById("v-reports").innerHTML=`<div class="panel">
   <h2 class="sec">التقارير المحفوظة</h2>
   <div class="sub" style="margin-bottom:12px">كل تقرير محفوظ هنا مرتبط ببيانات برنامجه — عدّل البيانات في أي وقت ويتحدث التقرير تلقائياً، ثم أعد طباعته. يُحفظ التقرير عند الضغط على «حفظ التقرير» أو عند طباعته.</div>
   <div class="list">${rows.map(({p,m,at})=>`<div class="li" style="flex-wrap:wrap">
      <div class="t"><b>${esc(p.name)}</b><span>${RTYPE[m]} · آخر حفظ: <span class="num">${fmt(at)}</span></span></div>
      ${pill(p)}
      <button class="btn" data-open="${p.id}">✏️ تعديل</button>
      <button class="btn primary" data-report="${p.id}" data-mode="${m}">🖨 معاينة وطباعة</button>
      <button class="btn" data-del="${p.id}|${m}" title="حذف من القائمة">🗑</button>
    </div>`).join("")||'<div class="empty">لا توجد تقارير محفوظة بعد — افتح أي برنامج ثم «تقرير التنفيذ» أو «نموذج ما قبل التنفيذ» واضغط «حفظ التقرير».</div>'}</div>
   <div id="delConfirm" class="track" hidden style="margin-top:10px">حذف التقرير من القائمة؟ (بيانات البرنامج تبقى كما هي) <button class="btn" id="delYes" style="color:var(--bad)">نعم، احذف</button> <button class="btn" id="delNo">إلغاء</button></div>
  </div>`;
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const [id,m]=b.dataset.del.split("|");delConfirm.hidden=false;
    delYes.onclick=()=>{delete st(id).reports[m];save();renderReports()};delNo.onclick=()=>delConfirm.hidden=true});
}

/* ============ PRESENTATION ============ */
let deck=[],di=0;
function slideHtml(x){
  const T=S.set;
  if(x==="cover") return `<div class="slide"><div class="eb">وزارة التعليم · هيئة الصحة العامة (وقاية) · الصحة القابضة</div><h2>الخطة المشتركة للبرامج الصحية المدرسية<br>للعام الدراسي 1448هـ</h2><div class="d">${esc(T.school)} — ${W("الموجه الصحي")}: ${esc(T.counselor)}<br>${deck.length-1} برنامجاً مرتبة حسب التاريخ</div></div>`;
  const p=byId[x],d=dates(p);
  return `<div class="slide"><div class="eb">${CATS[p.cat]} · ${p.term==="pre"?"قبل بداية العام":p.term==="t1"?"الفصل الأول":"الفصل الثاني"}</div>
   <h2>${esc(p.name)}</h2>
   <div class="meta"><div><small>الموعد</small>${d?whenText(p):esc(p.period)}</div><div><small>الفئة المستهدفة</small>${tgMine(p)}</div><div><small>المرحلة</small>${esc(p.stageNote||p.stages.map(k=>STAGE[k]).join("، "))}</div><div><small>الجهة المنفذة</small>${esc(W((p.exList||[EXN[p.ex]]).join("، ")))}</div></div>
   <div class="d">${esc(p.desc)}</div>
   ${p.role?`<div class="role d" style="font-size:clamp(15px,1.7vw,20px)"><b>${W("دور الموجه الصحي")}:</b> ${esc(W(p.role.join(" ")))}</div>`:""}</div>`;
}
function present(ids){
  deck=ids.length===1?ids:["cover",...ids];di=0;
  const el=document.createElement("div");el.className="show";el.id="show";document.body.appendChild(el);
  const draw=()=>{el.innerHTML=`<div class="show-top"><span>الخطة المشتركة للبرامج الصحية المدرسية 1448هـ</span><span class="sp"></span><span class="num">${di+1} / ${deck.length}</span><button id="fs">ملء الشاشة</button><button id="sx">إغلاق ✕</button></div>
    ${slideHtml(deck[di])}
    <div class="show-nav"><button id="sp" ${di===0?"disabled":""}>→ السابق</button><div class="dots">${deck.length<=40?deck.map((_,i)=>`<i class="${i===di?"on":""}"></i>`).join(""):""}</div><button id="sn" ${di===deck.length-1?"disabled":""}>التالي ←</button></div>`;
    sp.onclick=()=>{if(di>0){di--;draw()}};sn.onclick=()=>{if(di<deck.length-1){di++;draw()}};sx.onclick=end;
    fs.onclick=()=>{try{document.documentElement.requestFullscreen?.().catch(()=>{})}catch(e){}}};
  const key=e=>{if(e.key==="ArrowLeft"||e.key===" "){if(di<deck.length-1){di++;draw()}e.preventDefault()}else if(e.key==="ArrowRight"){if(di>0){di--;draw()}}else if(e.key==="Escape")end()};
  let tx=null;el.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
  el.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50){if(dx>0&&di<deck.length-1)di++;else if(dx<0&&di>0)di--;draw()}tx=null});
  function end(){document.removeEventListener("keydown",key);el.remove();try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
  document.addEventListener("keydown",key);draw();
}

/* ============ EVENTS ============ */
let toastT;function toast(t){let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.style.cssText="position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:99;font-weight:700";document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,2200)}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+t.dataset.v);try{localStorage.setItem(KEY+"_tab",t.dataset.v)}catch(e){}});
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]"),r=e.target.closest("[data-report]"),sh=e.target.closest("[data-show]");
  if(r){openReport("prog",r.dataset.report,r.dataset.mode||"pre");return}
  if(sh){document.getElementById("modalRoot").innerHTML="";present([sh.dataset.show]);return}
  if(o){openProg(o.dataset.open)}
});
["fq","fterm","fex","fst","fmine"].forEach(i=>document.getElementById(i).addEventListener("input",renderPrograms));
btnPresent.onclick=()=>{const v=[...document.querySelectorAll(".tab")].find(t=>t.getAttribute("aria-selected")==="true").dataset.v;present((v==="programs"?filtered():sorted(P.filter(mine))).map(p=>p.id))};
btnPlanPrint.onclick=()=>openReport("plan");
renderAll();
(async()=>{
  try{await IDB.open();const d=await IDB.get("state");
    if(d&&d.set&&(!S.savedAt||(d.savedAt||"")>=S.savedAt)){S=d;S.set={...DEF_SET,...S.set};renderAll()}
    else if(S.savedAt||Object.keys(S.prog).length){flush()}
  }catch(e){}
  try{persisted=await navigator.storage?.persisted?.();if(!persisted)persisted=await navigator.storage?.persist?.()}catch(e){}
  renderSettings();
})();
try{const t=localStorage.getItem(KEY+"_tab");if(t)document.querySelector(`.tab[data-v="${t}"]`)?.click()}catch(e){}
</script>
